syntax = "proto3";

package lookingglass.v0;
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/AS203038/looking-glass/protobuf/lookingglass/v0;lookingglass";
option java_multiple_files = true;
option java_outer_classname = "LookingGlassProto";
option java_package = "lookingglass.v0";

// LookingGlassService is the gRPC contract exposed by every Looking Glass instance.
service LookingGlassService {
  // GetInfo returns the hostname and version of the running instance.
  rpc GetInfo(google.protobuf.Empty) returns (GetInfoResponse) {}

  // GetRouters returns one page of the router catalogue with the latest health snapshot per entry.
  rpc GetRouters(GetRoutersRequest) returns (GetRoutersResponse) {}

  // Ping issues the vendor-template ping command against the chosen router.
  rpc Ping(PingRequest) returns (PingResponse) {}

  // Traceroute issues the vendor-template traceroute command against the chosen router.
  rpc Traceroute(TracerouteRequest) returns (TracerouteResponse) {}

  // BGPSummary returns the BGP neighbour summary table for the chosen router.
  rpc BGPSummary(BGPSummaryRequest) returns (BGPSummaryResponse) {}

  // BGPRoute looks up the BGP path(s) for a prefix or address.
  rpc BGPRoute(BGPRouteRequest) returns (BGPRouteResponse) {}

  // BGPCommunity lists every route tagged with the supplied RFC 1997 standard BGP community.
  rpc BGPCommunity(BGPCommunityRequest) returns (BGPCommunityResponse) {}

  // BGPLargeCommunity lists every route tagged with the supplied RFC 8092 large BGP community.
  rpc BGPLargeCommunity(BGPLargeCommunityRequest) returns (BGPLargeCommunityResponse) {}

  // BGPASPath lists every route whose AS-path matches the supplied regular expression.
  rpc BGPASPath(BGPASPathRequest) returns (BGPASPathResponse) {}

  // BGPPeerRoutes lists routing details on a per-peer session basis (received, accepted, rejected, or advertised).
  rpc BGPPeerRoutes(BGPPeerRoutesRequest) returns (BGPPeerRoutesResponse) {}
}

// ParserKind names the pipe that produced an operation's parsed payload.
enum ParserKind {
  // PARSER_KIND_UNSPECIFIED indicates that no parser was configured.
  PARSER_KIND_UNSPECIFIED = 0;
  // PARSER_KIND_TEXTFSM indicates a TextFSM template parsed plain CLI output.
  PARSER_KIND_TEXTFSM = 1;
  // PARSER_KIND_NATIVE_JSON indicates the router emitted JSON directly.
  PARSER_KIND_NATIVE_JSON = 2;
  // PARSER_KIND_BUILTIN indicates a hand-rolled parser produced the payload.
  PARSER_KIND_BUILTIN = 3;
}

// ParseStatus carries the outcome of the parser attempt.
enum ParseStatus {
  // PARSE_STATUS_OK indicates the parsed payload is populated and authoritative.
  PARSE_STATUS_OK = 0;
  // PARSE_STATUS_DISABLED indicates no parser was requested for this command.
  PARSE_STATUS_DISABLED = 1;
  // PARSE_STATUS_TEMPLATE_MISSING indicates a parser was configured but its asset was not found.
  PARSE_STATUS_TEMPLATE_MISSING = 2;
  // PARSE_STATUS_PARSE_FAILED indicates the parser ran but produced no useful structured form.
  PARSE_STATUS_PARSE_FAILED = 3;
}

// RouterHealth captures the outcome of the most recent reachability probe.
message RouterHealth {
  // timestamp is the time the probe completed.
  google.protobuf.Timestamp timestamp = 1;
  // healthy is true when the probe completed without an SSH error.
  bool healthy = 2;
}

// Router describes a single managed device.
message Router {
  // id is the stable, 1-based router identifier.
  int64 id = 1;
  // name is the operator-supplied display name.
  string name = 2;
  // location is the operator-supplied site label.
  string location = 4;
  // health is the latest reachability snapshot.
  RouterHealth health = 5;
  // bmp_active is true when the router is currently sending telemetry via BMP.
  bool bmp_active = 6;
}

// BGPCommunity is an RFC 1997 standard BGP community in "ASN:VALUE" form.
message BGPCommunity {
  // asn is the autonomous-system number that owns the community.
  int32 asn = 1;
  // value is the 16-bit local value assigned by the owning AS.
  int32 value = 2;
}

// BGPLargeCommunity is an RFC 8092 large BGP community in "GLOBAL:LOCAL1:LOCAL2" form.
message BGPLargeCommunity {
  // global_admin is the Global Administrator (typically an ASN).
  uint32 global_admin = 1;
  // local_data1 is the first 32-bit Local Data Part.
  uint32 local_data1 = 2;
  // local_data2 is the second 32-bit Local Data Part.
  uint32 local_data2 = 3;
}

// GetInfoResponse carries the server identity for GetInfo.
message GetInfoResponse {
  // hostname is the OS-reported hostname of the server.
  string hostname = 1;
  // version is the build's release identifier.
  string version = 2;
}

// GetRoutersRequest selects one page of the router catalogue.
message GetRoutersRequest {
  // limit is the maximum number of rows to return; server default is 10 when zero.
  uint32 limit = 1;

  // page_token is the 1-based page index; zero is treated as 1.
  uint32 page_token = 2;
}

// GetRoutersResponse carries one page of routers plus pagination metadata.
message GetRoutersResponse {
  // routers are the rows for this page, in stable catalogue order.
  repeated Router routers = 1;

  // next_page is the token to pass back for the next page, or 0 when no further pages are available.
  uint32 next_page = 2;

  // timestamp is the response generation time.
  google.protobuf.Timestamp timestamp = 3;
}

// PingStats is the normalised summary of a ping run.
message PingStats {
  // target is the address actually probed, as reported by the router.
  string target = 1;
  // source is the bound source address used by the probe, when reported.
  string source = 2;
  // packets_sent is the number of echo requests issued.
  uint32 packets_sent = 3;
  // packets_received is the number of echo replies returned.
  uint32 packets_received = 4;
  // loss_pct is the packet-loss percentage as reported by the router (0–100).
  float loss_pct = 5;
  // rtt_min_ms is the minimum round-trip time in milliseconds, or 0 when not reported.
  float rtt_min_ms = 6;
  // rtt_avg_ms is the mean round-trip time in milliseconds, or 0 when not reported.
  float rtt_avg_ms = 7;
  // rtt_max_ms is the maximum round-trip time in milliseconds, or 0 when not reported.
  float rtt_max_ms = 8;
  // rtt_mdev_ms is the standard deviation of round-trip times in milliseconds, or 0 when not reported.
  float rtt_mdev_ms = 9;
}

// TracerouteHop is one row of a TracerouteParsed.hops list.
message TracerouteHop {
  // ttl is the hop number (1-based) from source to destination.
  uint32 ttl = 1;
  // probes lists the per-probe responses for this hop.
  repeated TracerouteProbe probes = 2;
}

// TracerouteProbe is a single TTL probe response.
message TracerouteProbe {
  // ip is the responding hop's IP address, or empty when the hop timed out.
  string ip = 1;
  // hostname is the reverse-DNS name of ip, when the router resolved it.
  string hostname = 2;
  // rtt_ms is the measured round-trip time for this probe in milliseconds; zero indicates a timeout.
  float rtt_ms = 3;
  // asn is the ASN reported by the router for this hop, or zero when unknown.
  uint32 asn = 4;
}

// TracerouteParsed is the structured form of a traceroute run.
message TracerouteParsed {
  // target is the destination address as reported by the router.
  string target = 1;
  // source is the bound source address used by the probe, when reported.
  string source = 2;
  // hops lists every TTL probed, in order.
  repeated TracerouteHop hops = 3;
}

// BGPPath represents one path for a BGP prefix as reported by a router.
message BGPPath {
  // prefix is the network prefix in CIDR form.
  string prefix = 1;
  // nexthop is the BGP next-hop address.
  string nexthop = 2;
  // as_path is the ordered list of AS numbers traversed.
  repeated uint32 as_path = 3;
  // origin is the BGP origin attribute: "igp", "egp", or "incomplete".
  string origin = 4;
  // med is the Multi-Exit Discriminator; zero when unset.
  uint32 med = 5;
  // local_pref is the LOCAL_PREF attribute; zero when unset.
  uint32 local_pref = 6;
  // communities lists standard (RFC 1997) communities in "ASN:VALUE" wire form.
  repeated string communities = 7;
  // large_communities lists large (RFC 8092) communities in "GLOBAL:LOCAL1:LOCAL2" wire form.
  repeated string large_communities = 8;
  // best is true when the router has selected this path as best.
  bool best = 9;
  // peer_asn is the ASN of the directly-connected peer that announced this path.
  uint32 peer_asn = 10;
  // peer_ip is the IP of the directly-connected peer that announced this path.
  string peer_ip = 11;
  // age_seconds is how long the path has been in the table, in seconds.
  uint64 age_seconds = 12;
}

// BGPPaths is a flat list of BGPPath entries.
message BGPPaths {
  // paths is the matched path set, in router-supplied order.
  repeated BGPPath paths = 1;
}

// BGPPeer represents one row of a BGP neighbour summary table.
message BGPPeer {
  // peer_ip is the neighbour's IP address.
  string peer_ip = 1;
  // peer_asn is the neighbour's autonomous-system number.
  uint32 peer_asn = 2;
  // description is the operator-supplied neighbour description.
  string description = 3;
  // state is the BGP session state, normalised to lower-case.
  string state = 4;
  // state_detail carries any vendor sub-state, free-form.
  string state_detail = 5;
  // uptime_seconds is how long the session has been in its current state, in seconds.
  uint64 uptime_seconds = 6;
  // prefixes_received is the count of prefixes accepted from this neighbour.
  uint64 prefixes_received = 7;
  // prefixes_accepted is the count after policy filtering.
  uint64 prefixes_accepted = 8;
  // prefixes_sent is the count of prefixes advertised to this neighbour.
  uint64 prefixes_sent = 9;
  // address_family is the address family label reported by the router.
  string address_family = 10;
}

// BGPSummaryParsed is the structured form of a BGP neighbour summary.
message BGPSummaryParsed {
  // local_asn is the local autonomous-system number.
  uint32 local_asn = 1;
  // router_id is the BGP router-id.
  string router_id = 2;
  // peers lists every BGP neighbour, in router-supplied order.
  repeated BGPPeer peers = 3;
}

// PingRequest selects the router and target for a Ping RPC.
message PingRequest {
  // router_id is the 1-based identifier returned by GetRouters.
  int64 router_id = 1;

  // target is the destination address, CIDR, or hostname.
  string target = 2;
}

// PingResponse carries the raw ping output and, when a parser ran, the structured PingStats.
message PingResponse {
  // result is the concatenated stdout of the commands issued by the vendor template.
  bytes result = 1;

  // timestamp is the server time when the response was assembled.
  google.protobuf.Timestamp timestamp = 2;

  // parsed is the structured form of result when parse_status is OK.
  PingStats parsed = 3;

  // parser_kind names the parser that produced parsed.
  ParserKind parser_kind = 4;

  // parse_status reports the outcome of the parser attempt.
  ParseStatus parse_status = 5;
}

// TracerouteRequest selects the router and target for a Traceroute RPC.
message TracerouteRequest {
  // router_id is the 1-based identifier returned by GetRouters.
  int64 router_id = 1;

  // target is the destination address, CIDR, or hostname.
  string target = 2;
}

// TracerouteResponse carries the raw traceroute output and, when a parser ran, the structured hops.
message TracerouteResponse {
  // result is the concatenated stdout of the commands issued by the vendor template.
  bytes result = 1;

  // timestamp is the server time when the response was assembled.
  google.protobuf.Timestamp timestamp = 2;

  // parsed is the structured form of `result` when a parser ran
  // successfully. Unset otherwise.
  TracerouteParsed parsed = 3;

  // parser_kind names the parser that produced `parsed`.
  ParserKind parser_kind = 4;

  // parse_status reports the outcome of the parser attempt.
  ParseStatus parse_status = 5;
}

// BGPSummaryRequest selects the router for a BGPSummary RPC.
message BGPSummaryRequest {
  // router_id is the 1-based identifier returned by GetRouters.
  int64 router_id = 1;
}

// BGPSummaryResponse carries the raw summary output and, when a parser ran, the structured peer table.
message BGPSummaryResponse {
  // result is the concatenated stdout of the summary command(s).
  bytes result = 1;

  // timestamp is the server time when the response was assembled.
  google.protobuf.Timestamp timestamp = 2;

  // parsed is the structured form of `result` when a parser ran
  // successfully. Unset otherwise.
  BGPSummaryParsed parsed = 3;

  // parser_kind names the parser that produced `parsed`.
  ParserKind parser_kind = 4;

  // parse_status reports the outcome of the parser attempt.
  ParseStatus parse_status = 5;
}

// BGPRouteRequest selects the router and prefix for a BGPRoute RPC.
message BGPRouteRequest {
  // router_id is the 1-based identifier returned by GetRouters.
  int64 router_id = 1;

  // target is the prefix or address to look up.
  string target = 2;
}

// BGPRouteResponse carries the raw lookup output and, when a parser ran, the structured path list.
message BGPRouteResponse {
  // result is the concatenated stdout of the lookup command(s).
  bytes result = 1;

  // timestamp is the server time when the response was assembled.
  google.protobuf.Timestamp timestamp = 2;

  // parsed is the structured form of `result` when a parser ran
  // successfully. Unset otherwise.
  BGPPaths parsed = 3;

  // parser_kind names the parser that produced `parsed`.
  ParserKind parser_kind = 4;

  // parse_status reports the outcome of the parser attempt.
  ParseStatus parse_status = 5;
}

// BGPCommunityRequest selects the router and community for a BGPCommunity RPC.
message BGPCommunityRequest {
  // router_id is the 1-based identifier returned by GetRouters.
  int64 router_id = 1;
  // community is the RFC 1997 standard community to look up.
  BGPCommunity community = 2;
}

// BGPCommunityResponse carries the raw lookup output and, when a parser ran, the structured path list.
message BGPCommunityResponse {
  // result is the concatenated stdout of the lookup command(s).
  bytes result = 1;

  // timestamp is the server time when the response was assembled.
  google.protobuf.Timestamp timestamp = 2;

  // parsed is the structured form of `result` when a parser ran
  // successfully. Unset otherwise.
  BGPPaths parsed = 3;

  // parser_kind names the parser that produced `parsed`.
  ParserKind parser_kind = 4;

  // parse_status reports the outcome of the parser attempt.
  ParseStatus parse_status = 5;
}

// BGPLargeCommunityRequest selects the router and large community for a BGPLargeCommunity RPC.
message BGPLargeCommunityRequest {
  // router_id is the 1-based identifier returned by GetRouters.
  int64 router_id = 1;
  // community is the RFC 8092 large community to look up.
  BGPLargeCommunity community = 2;
}

// BGPLargeCommunityResponse carries the raw lookup output and, when a parser ran, the structured path list.
message BGPLargeCommunityResponse {
  // result is the concatenated stdout of the lookup command(s).
  bytes result = 1;

  // timestamp is the server time when the response was assembled.
  google.protobuf.Timestamp timestamp = 2;

  // parsed is the structured form of `result` when a parser ran
  // successfully. Unset otherwise.
  BGPPaths parsed = 3;

  // parser_kind names the parser that produced `parsed`.
  ParserKind parser_kind = 4;

  // parse_status reports the outcome of the parser attempt.
  ParseStatus parse_status = 5;
}

// BGPASPathRequest selects the router and AS-path regex for a BGPASPath RPC.
message BGPASPathRequest {
  // router_id is the 1-based identifier returned by GetRouters.
  int64 router_id = 1;

  // pattern is the AS-path regex.
  string pattern = 2;
}

// BGPASPathResponse carries the raw lookup output and, when a parser ran, the structured path list.
message BGPASPathResponse {
  // result is the concatenated stdout of the lookup command(s).
  bytes result = 1;

  // timestamp is the server time when the response was assembled.
  google.protobuf.Timestamp timestamp = 2;

  // parsed is the structured form of `result` when a parser ran
  // successfully. Unset otherwise.
  BGPPaths parsed = 3;

  // parser_kind names the parser that produced `parsed`.
  ParserKind parser_kind = 4;

  // parse_status reports the outcome of the parser attempt.
  ParseStatus parse_status = 5;
}

// PeerRouteQueryType selects the specific peer RIB to dump.
enum PeerRouteQueryType {
  PEER_ROUTE_QUERY_TYPE_UNSPECIFIED = 0;
  PEER_ROUTE_QUERY_TYPE_RECEIVED = 1;
  PEER_ROUTE_QUERY_TYPE_ACCEPTED = 2;
  PEER_ROUTE_QUERY_TYPE_REJECTED = 3;
  PEER_ROUTE_QUERY_TYPE_ADVERTISED = 4;
}

// BGPPeerRoutesRequest selects the router, peer identification, and query filter.
message BGPPeerRoutesRequest {
  // router_id is the 1-based identifier returned by GetRouters.
  int64 router_id = 1;

  // peer_ip is the IP address of the peer session. Optional when name is used.
  string peer_ip = 2;

  // peer_name is the administrative name of the peer session. Optional when IP is used.
  string peer_name = 3;

  // query_type specifies which peer routing data to retrieve.
  PeerRouteQueryType query_type = 4;

  // limit is the maximum number of paths to return.
  uint32 limit = 5;

  // page_token is the pagination cursor from HSCAN.
  string page_token = 6;
}

// BGPPeerRoutesResponse carries the raw lookup output and the parsed path details.
message BGPPeerRoutesResponse {
  // result is the concatenated stdout of the command(s).
  bytes result = 1;

  // timestamp is the server execution timestamp.
  google.protobuf.Timestamp timestamp = 2;

  // parsed is the structured form of `result`.
  BGPPaths parsed = 3;

  // parser_kind names the parser that ran.
  ParserKind parser_kind = 4;

  // parse_status reports the parser outcome.
  ParseStatus parse_status = 5;

  // next_page_token is the next pagination cursor (empty when done).
  string next_page_token = 6;
}
