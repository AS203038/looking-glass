<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<style>
			/* ------------------------------------------------------------------
			 * Pre-hydration loading overlay (framework-free).
			 *
			 * Rendered from the static HTML shell before any JS has executed,
			 * so all styles here must be self-contained — no Tailwind tokens,
			 * no component imports. We *do* read the resolved Catppuccin
			 * Base / Crust / Text via CSS vars on :root so the overlay
			 * matches the user's mode without flashing.
			 *
			 * The bootstrap script below sets `.dark` and `data-flavor` on
			 * <html> before first paint. layout.css then provides the
			 * matching --lg-base / --lg-crust / --lg-text values for the
			 * overlay to consume.
			 * ------------------------------------------------------------------ */

			:root {
				/* Latte (default-light) Catppuccin tokens used pre-hydration */
				--lg-base: #eff1f5;
				--lg-crust: #dce0e8;
				--lg-text: #4c4f69;
				--lg-accent: #1e66f5;
				--lg-overlay: rgba(76, 79, 105, 0.18);
			}
			html.dark {
				/* Mocha (default-dark) */
				--lg-base: #1e1e2e;
				--lg-crust: #11111b;
				--lg-text: #cdd6f4;
				--lg-accent: #89b4fa;
				--lg-overlay: rgba(205, 214, 244, 0.16);
			}

			html,
			body {
				margin: 0;
				background: var(--lg-base);
				color: var(--lg-text);
			}

			#lg-boot {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				background: var(--lg-base);
				color: var(--lg-text);
				z-index: 9999;
				opacity: 1;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					'Helvetica Neue',
					sans-serif;
				transition: opacity 250ms ease-out;
			}
			#lg-boot.lg-hide {
				opacity: 0;
				pointer-events: none;
			}

			.lg-track {
				--hop-size: 14px;
				--track-w: min(72vw, 360px);
				position: relative;
				width: var(--track-w);
				height: calc(var(--hop-size) * 2.2);
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.lg-track::before {
				content: '';
				position: absolute;
				top: 50%;
				left: calc(var(--hop-size) / 2);
				right: calc(var(--hop-size) / 2);
				height: 2px;
				transform: translateY(-50%);
				background: var(--lg-overlay);
				border-radius: 2px;
			}
			.lg-hop {
				position: relative;
				width: var(--hop-size);
				height: var(--hop-size);
				border-radius: 50%;
				background: var(--lg-overlay);
				animation: lg-hop-pulse 2.4s ease-in-out infinite;
				animation-delay: calc(var(--i) * 0.48s);
				z-index: 1;
			}
			.lg-packet {
				position: absolute;
				top: 50%;
				left: 0;
				width: calc(var(--hop-size) * 0.55);
				height: calc(var(--hop-size) * 0.55);
				border-radius: 50%;
				background: var(--lg-accent);
				transform: translate(-50%, -50%);
				animation: lg-packet 2.4s ease-in-out infinite;
				z-index: 2;
			}
			.lg-title {
				font-size: 1.125rem;
				font-weight: 600;
				letter-spacing: 0.02em;
				opacity: 0.9;
			}
			.lg-sub {
				font-size: 0.8125rem;
				letter-spacing: 0.04em;
				opacity: 0.6;
				font-variant-numeric: tabular-nums;
			}
			.lg-sub::after {
				content: '';
				display: inline-block;
				width: 1.2em;
				text-align: left;
				animation: lg-dots 1.4s steps(4, end) infinite;
			}

			@keyframes lg-hop-pulse {
				0%,
				40%,
				100% {
					background: var(--lg-overlay);
					transform: scale(1);
				}
				10%,
				25% {
					background: var(--lg-accent);
					transform: scale(1.35);
				}
			}
			@keyframes lg-packet {
				0% {
					left: 0%;
					opacity: 0;
				}
				5% {
					opacity: 1;
				}
				95% {
					opacity: 1;
				}
				100% {
					left: 100%;
					opacity: 0;
				}
			}
			@keyframes lg-dots {
				0% {
					content: '';
				}
				25% {
					content: '.';
				}
				50% {
					content: '..';
				}
				75%,
				100% {
					content: '...';
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.lg-hop {
					animation: none;
					background: var(--lg-accent);
					opacity: 0.4;
				}
				.lg-packet {
					display: none;
				}
				.lg-sub::after {
					animation: none;
					content: '...';
				}
			}
		</style>
		<script>
			// Bootstrap the user's theme preference before first paint so the
			// overlay (and subsequent UI) doesn't flash the wrong palette.
			//
			// Two-mode model: `lg-mode` is 'light' | 'dark' | null (=system).
			// We only set `.dark` on <html>; the rest of the theming is driven
			// from CSS by the dark variant in layout.css.
			(function () {
				try {
					var mode = localStorage.getItem('lg-mode');
					var prefersDark =
						mode === 'dark' ||
						(mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (prefersDark) document.documentElement.classList.add('dark');
				} catch (e) {
					/* localStorage unavailable — fall through with no-op */
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="lg-boot" role="status" aria-label="Loading">
			<div class="lg-track" aria-hidden="true">
				<span class="lg-hop" style="--i: 0"></span>
				<span class="lg-hop" style="--i: 1"></span>
				<span class="lg-hop" style="--i: 2"></span>
				<span class="lg-hop" style="--i: 3"></span>
				<span class="lg-hop" style="--i: 4"></span>
				<span class="lg-packet"></span>
			</div>
			<div class="lg-title">Looking Glass</div>
			<div class="lg-sub">tracing route</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
