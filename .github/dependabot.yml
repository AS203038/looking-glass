version: 2
updates:
  # protobuf is a member of the webui pnpm workspace: this entry updates it together with webui/pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  # The node-builder image also sets the Node version of CI (.github/actions/setup-node).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
