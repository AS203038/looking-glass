name: frrouting

ping:
    ipv4:
        - ping -n -4 -c5 -I {{.Cfg.Source4.IP}} {{.IP.IP}}
    ipv6:
        - ping -n -6 -c5 -I {{.Cfg.Source6.IP}} {{.IP.IP}}

traceroute:
    ipv4:
        - traceroute -4 -w 1 -q1 -I --back --mtu -e -s {{.Cfg.Source4.IP}} {{.IP.IP}}
    ipv6:
        - traceroute -6 -w 1 -q1 -I --back --mtu -e -s {{.Cfg.Source6.IP}} {{.IP.IP}}

bgp:
    summary:
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} ipv4 unicast summary json'
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} ipv6 unicast summary json'
    route:
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} {{.IP.Family}} unicast {{.IP.IP}} json'
    community:
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} ipv4 unicast community {{.Community}} json'
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} ipv6 unicast community {{.Community}} json'
    largecommunity:
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} ipv4 unicast large-community {{.LargeCommunity}} json'
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} ipv6 unicast large-community {{.LargeCommunity}} json'
    aspath:
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} ipv4 unicast regexp {{.ASPath}} json'
        - vtysh -c 'show bgp vrf {{.Cfg.VRF}} ipv6 unicast regexp {{.ASPath}} json'

parsers:
    ping:
        kind: builtin
    traceroute:
        kind: builtin
    bgp.summary:
        kind: native_json
        schema: frr_bgp_summary_v1
    bgp.route:
        kind: native_json
        schema: frr_bgp_route_v1
    bgp.community:
        kind: native_json
        schema: frr_bgp_route_v1
    bgp.largecommunity:
        kind: native_json
        schema: frr_bgp_route_v1
    bgp.aspath:
        kind: native_json
        schema: frr_bgp_route_v1
