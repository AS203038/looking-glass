name: juniper_junos

ping:
    ipv4:
        - ping {{.IP.IP}} source {{.Cfg.Source4.IP}} count 5 rapid routing-instance {{.Cfg.VRF}}
    ipv6:
        - ping {{.IP.IP}} source {{.Cfg.Source6.IP}} count 5 rapid routing-instance {{.Cfg.VRF}}

traceroute:
    ipv4:
        - traceroute {{.IP.IP}} source {{.Cfg.Source4.IP}} routing-instance {{.Cfg.VRF}}
    ipv6:
        - traceroute {{.IP.IP}} source {{.Cfg.Source6.IP}} routing-instance {{.Cfg.VRF}}

bgp:
    summary:
        - show bgp summary instance {{.Cfg.VRF}}
    route:
        - 'show route protocol bgp {{.IP.IP}} table {{.Cfg.VRF}}.{{if eq .IP.Family "ipv4"}}inet{{else}}inet6{{end}}.0 detail'
    community:
        - show route protocol bgp community {{.Community}} table {{.Cfg.VRF}}.inet.0 detail
        - show route protocol bgp community {{.Community}} table {{.Cfg.VRF}}.inet6.0 detail
    largecommunity:
        - show route protocol bgp large-community {{.LargeCommunity}} table {{.Cfg.VRF}}.inet.0 detail
        - show route protocol bgp large-community {{.LargeCommunity}} table {{.Cfg.VRF}}.inet6.0 detail
    aspath:
        - show route protocol bgp aspath-regex "{{.ASPath}}" table {{.Cfg.VRF}}.inet.0 detail
        - show route protocol bgp aspath-regex "{{.ASPath}}" table {{.Cfg.VRF}}.inet6.0 detail

parsers:
    ping:
        kind: textfsm
        template: juniper_junos_ping
    traceroute:
        kind: textfsm
        template: juniper_junos_traceroute
    bgp.summary:
        kind: textfsm
        template: juniper_junos_show_bgp_summary
    bgp.route:
        kind: textfsm
        template: juniper_junos_show_route_bgp
    bgp.community:
        kind: textfsm
        template: juniper_junos_show_route_bgp
    bgp.largecommunity:
        kind: textfsm
        template: juniper_junos_show_route_bgp
    bgp.aspath:
        kind: textfsm
        template: juniper_junos_show_route_bgp
