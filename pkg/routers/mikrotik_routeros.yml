name: mikrotik_routeros

ping:
    ipv4:
        - /ping {{.IP.IP}} src-address={{.Cfg.Source4.IP}} count=5 vrf={{.Cfg.VRF}}
    ipv6:
        - /ping {{.IP.IP}} src-address={{.Cfg.Source6.IP}} count=5 vrf={{.Cfg.VRF}}

traceroute:
    ipv4:
        - :put "target={{.IP.IP}}"; :local i 1; :foreach h in=[/tool traceroute {{.IP.IP}} src-address={{.Cfg.Source4.IP}} vrf={{.Cfg.VRF}} count=1 duration=10s as-value] do={ :local a ($h->"avg"); :local r ""; :if ([:typeof $a] != "nothing") do={ :set r (($a / 10) . "." . ($a % 10)) }; :put ("ttl=$i;address=" . ($h->"address") . ";rtt=$r"); :set i ($i + 1) }
    ipv6:
        - :put "target={{.IP.IP}}"; :local i 1; :foreach h in=[/tool traceroute {{.IP.IP}} src-address={{.Cfg.Source6.IP}} vrf={{.Cfg.VRF}} count=1 duration=10s as-value] do={ :local a ($h->"avg"); :local r ""; :if ([:typeof $a] != "nothing") do={ :set r (($a / 10) . "." . ($a % 10)) }; :put ("ttl=$i;address=" . ($h->"address") . ";rtt=$r"); :set i ($i + 1) }

bgp:
    summary:
        - /routing bgp session print detail without-paging
    route:
        - /routing route print detail where bgp and dst-address~"{{.IP.IP}}"
    community:
        - /routing route print detail where bgp.communities~"{{.Community}}"
    largecommunity:
        - /routing route print detail where bgp.large-communities~"{{.LargeCommunity}}"
    aspath:
        - /routing route print detail where bgp.as-path~"{{.ASPath}}"
    peer_routes:
        received:
            - /routing route print detail where bgp and belongs-to~"{{.PeerIP}}"
        accepted:
            - /routing route print detail where bgp and belongs-to~"{{.PeerIP}}" and !filtered
        rejected:
            - /routing route print detail where bgp and belongs-to~"{{.PeerIP}}" and filtered
        advertised:
            - /routing bgp advertisements print detail where peer~"{{.PeerName}}"

parsers:
    ping:
        kind: textfsm
        template: mikrotik_routeros_ping
    traceroute:
        kind: textfsm
        template: mikrotik_routeros_traceroute
    bgp.summary:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_session
    bgp.route:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_routes
    bgp.community:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_routes
    bgp.largecommunity:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_routes
    bgp.aspath:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_routes
    bgp.peer_routes.received:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_routes
    bgp.peer_routes.accepted:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_routes
    bgp.peer_routes.rejected:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_routes
    bgp.peer_routes.advertised:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_advertisements
