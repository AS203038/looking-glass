name: mikrotik_routeros

ping:
    ipv4:
        - /ping {{.IP.IP}} src-address={{.Cfg.Source4.IP}} count=5 routing-table={{.Cfg.VRF}}
    ipv6:
        - /ping {{.IP.IP}} src-address={{.Cfg.Source6.IP}} count=5 routing-table={{.Cfg.VRF}}

traceroute:
    ipv4:
        - /tool traceroute {{.IP.IP}} src-address={{.Cfg.Source4.IP}} routing-table={{.Cfg.VRF}} count=1 duration=10s
    ipv6:
        - /tool traceroute {{.IP.IP}} src-address={{.Cfg.Source6.IP}} routing-table={{.Cfg.VRF}} count=1 duration=10s

bgp:
    summary:
        - /routing bgp session print detail without-paging
    route:
        - /routing bgp advertisements print detail where dst-address~"{{.IP.IP}}"
    community:
        - /routing bgp advertisements print detail where communities~"{{.Community}}"
    largecommunity:
        - /routing bgp advertisements print detail where large-communities~"{{.LargeCommunity}}"
    aspath:
        - /routing bgp advertisements print detail where as-path~"{{.ASPath}}"

parsers:
    ping:
        kind: textfsm
        template: mikrotik_routeros_ping
    traceroute:
        kind: textfsm
        template: mikrotik_routeros_traceroute
    bgp.summary:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_summary
    bgp.route:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_advertisements
    bgp.community:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_advertisements
    bgp.largecommunity:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_advertisements
    bgp.aspath:
        kind: textfsm
        template: mikrotik_routeros_show_bgp_advertisements
