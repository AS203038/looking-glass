name: arista_eos

ping:
    ipv4:
        - ping vrf {{.Cfg.VRF}} ip {{.IP.IP}} source {{.Cfg.Source4.IP}} repeat 5
    ipv6:
        - ping vrf {{.Cfg.VRF}} ipv6 {{.IP.IP}} source {{.Cfg.Source6.IP}} repeat 5

traceroute:
    ipv4:
        - traceroute vrf {{.Cfg.VRF}} ip {{.IP.IP}} source {{.Cfg.Source4.IP}}
    ipv6:
        - traceroute vrf {{.Cfg.VRF}} ipv6 {{.IP.IP}} source {{.Cfg.Source6.IP}}

bgp:
    summary:
        - show ip bgp summary vrf {{.Cfg.VRF}}
        - show ipv6 bgp summary vrf {{.Cfg.VRF}}
    route:
        - 'show {{if eq .IP.Family "ipv4"}}ip{{else}}ipv6{{end}} bgp {{.IP.IP}} vrf {{.Cfg.VRF}}'
    community:
        - show ip bgp community {{.Community}} detail vrf {{.Cfg.VRF}}
        - show ipv6 bgp community {{.Community}} detail vrf {{.Cfg.VRF}}
    largecommunity:
        - show ip bgp large-community {{.LargeCommunity}} detail vrf {{.Cfg.VRF}}
        - show ipv6 bgp large-community {{.LargeCommunity}} detail vrf {{.Cfg.VRF}}
    aspath:
        - show ip bgp regexp {{.ASPath}} vrf {{.Cfg.VRF}}
        - show ipv6 bgp regexp {{.ASPath}} vrf {{.Cfg.VRF}}

parsers:
    ping:
        kind: textfsm
        template: arista_eos_ping
    traceroute:
        kind: textfsm
        template: arista_eos_traceroute
    bgp.summary:
        kind: textfsm
        template: arista_eos_show_bgp_summary
    bgp.route:
        kind: textfsm
        template: arista_eos_show_bgp_paths
    bgp.community:
        kind: textfsm
        template: arista_eos_show_bgp_paths
    bgp.largecommunity:
        kind: textfsm
        template: arista_eos_show_bgp_paths
    bgp.aspath:
        kind: textfsm
        template: arista_eos_show_bgp_table
